# Reviewer stack (not executed on the build machine - no Docker there; see docs/CONTRACTS.md section 1).
x-env: &env
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: ilm
  PGPASSWORD: ilm
  PGDATABASE: warehouse
  KAFKA_BOOTSTRAP: kafka:9092
  SPARK_MASTER: local[2]
services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: ilm, POSTGRES_PASSWORD: ilm, POSTGRES_DB: warehouse}
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./docker/init-airflow-db.sql:/docker-entrypoint-initdb.d/10-airflow.sql]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ilm -d warehouse"], interval: 5s, retries: 20}
    mem_limit: 768m
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    mem_limit: 768m
  runner:
    build: {context: ., dockerfile: docker/Dockerfile.runner}
    environment: *env
    volumes: [.:/app]
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 2g
  airflow:
    image: apache/airflow:2.10.5-python3.12
    command: standalone
    environment:
      <<: *env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://ilm:ilm@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /app/orchestration/dags
      PYTHONPATH: /app
    volumes: [.:/app]
    ports: ["8080:8080"]
    depends_on: {postgres: {condition: service_healthy}}
    mem_limit: 1536m
volumes: {pgdata: {}}
